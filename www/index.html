/* Layout: sticky slim header, one centered column (max 1040px), panels on a cool paper ground; kanji set in a serif, UI in a gothic. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface2:#eaeef7; --line:#d7dcec; --ink:#151c37; --muted:#586283;
  --accent:#3445c4; --accent-ink:#ffffff; --accent-soft:#e3e7fb;
  --good:#17794d; --good-soft:#dcf2e6; --bad:#b3261e; --bad-soft:#fae3e0; --star:#d39500;
  --shadow:0 1px 2px rgba(21,28,55,.06),0 10px 28px rgba(21,28,55,.07);
  --f-ui:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-kanji:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho','Noto Serif CJK JP',serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1325; --surface:#171e37; --surface2:#1f2848; --line:#2c3658; --ink:#e8ecfa; --muted:#9aa4c8;
  --accent:#93a0ff; --accent-ink:#0e1325; --accent-soft:#272f5d;
  --good:#58d69d; --good-soft:#12382a; --bad:#ff9087; --bad-soft:#44211f; --star:#f2bd2e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1325; --surface:#171e37; --surface2:#1f2848; --line:#2c3658; --ink:#e8ecfa; --muted:#9aa4c8;
  --accent:#93a0ff; --accent-ink:#0e1325; --accent-soft:#272f5d;
  --good:#58d69d; --good-soft:#12382a; --bad:#ff9087; --bad-soft:#44211f; --star:#f2bd2e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.nav button.resume{background:var(--accent);color:var(--accent-ink)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:17px;border:0;background:none;padding:0;letter-spacing:-.01em}
.brand b{font-family:var(--f-kanji);font-size:22px;color:var(--accent);font-weight:600}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
.nav button{border:0;background:none;padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav button:hover{color:var(--ink)}
main{max-width:1040px;margin:0 auto;padding-top:22px;min-width:0}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px}h2{font-size:19px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.panel+.panel,.panel+.grid,.grid+.panel,.stack>*+*{margin-top:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;max-width:100%}
textarea{width:100%;min-height:120px;resize:vertical;font-family:var(--f-ui)}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);font-weight:500}
.hero{display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero p{margin:6px 0 0;color:var(--muted)}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.2;color:var(--muted)}
.ring b{display:block;font-size:20px;color:var(--ink)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.mode{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);width:100%}
.mode:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.mode i{font-style:normal;font-family:var(--f-kanji);font-size:34px;line-height:1;color:var(--accent);flex:none;width:44px;text-align:center}
.mode b{display:block;font-size:16px}
.mode span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.sectitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 0 10px}
details>summary{cursor:pointer;font-weight:500;padding:4px 0}
details .chips{margin-top:10px}
.chips .chip small{opacity:.7;margin-left:4px}
.mhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mhead h2{margin-right:auto}
.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.cardwrap{perspective:1400px;margin:14px 0;touch-action:pan-y}
.card3d{position:relative;height:min(52vh,360px);min-height:260px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card3d.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--surface)}
.kz{font-family:var(--f-kanji);font-size:clamp(84px,22vw,150px);line-height:1;font-weight:400}
.mz{font-size:clamp(22px,5vw,32px);font-weight:700;line-height:1.35;max-width:26ch}
.rz{font-size:clamp(26px,6vw,40px);font-weight:700;letter-spacing:.04em}
.sub{color:var(--muted);font-size:16px}
.sub.k{font-family:var(--f-kanji);font-size:28px}
.starb{position:absolute;top:12px;right:12px;border:0;background:none;font-size:24px;line-height:1;color:var(--line);padding:6px}
.starb.on{color:var(--star)}
.speak{position:absolute;top:12px;left:12px;border:0;background:var(--surface2);border-radius:99px;padding:6px 10px;font-size:12px;color:var(--muted)}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
.q{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 0 20px;min-height:150px;justify-content:center}
.q .kz{font-size:clamp(70px,18vw,110px)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:560px){.choices{grid-template-columns:1fr}}
.choice{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;min-height:54px;font-weight:500;width:100%}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice kbd{font-family:inherit;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;flex:none}
.choice .ck{font-family:var(--f-kanji);font-size:28px;line-height:1.1}
.choice.good{background:var(--good-soft);border-color:var(--good)}
.choice.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface2)}
.fb.good{background:var(--good-soft);color:var(--good)}.fb.bad{background:var(--bad-soft)}
.fb .ans{font-weight:700;color:var(--ink)}
.tile-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:640px){.tile-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:420px){.tile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{min-height:86px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;display:grid;place-items:center;text-align:center;font-weight:500;line-height:1.3;box-shadow:var(--shadow);transition:opacity .25s,transform .25s}
.tile.k{font-family:var(--f-kanji);font-size:32px;font-weight:400}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.done{opacity:0;transform:scale(.85);pointer-events:none}
.tile.shake{animation:sh .3s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}
.list{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.wrow{display:grid;grid-template-columns:auto auto 64px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .rk{font-family:var(--f-kanji);font-size:30px;line-height:1;text-align:center}
.wrow .rm{min-width:0;overflow-wrap:anywhere}
.wrow .rr{color:var(--accent);font-weight:500;font-size:13px}
.wrow .starb{position:static;font-size:20px;padding:2px 4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.b1,.dot.b2{background:#d9a21b}.dot.b3,.dot.b4,.dot.b5{background:var(--good)}
.dot.x{background:var(--bad)}
@media(max-width:520px){.wrow{grid-template-columns:auto auto 52px minmax(0,1fr) auto;}.wrow .dot{display:none}.wrow .rk{font-size:26px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{color:var(--muted);font-size:13px}
.srow{display:grid;grid-template-columns:150px minmax(0,1fr) 78px auto;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
@media(max-width:560px){.srow{grid-template-columns:110px minmax(0,1fr) auto}.srow .pct{display:none}}
.stack3{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.stack3 i{display:block;height:100%}
.week{display:flex;gap:10px;align-items:flex-end;height:120px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.week i{display:block;width:100%;max-width:38px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.qitem{padding:16px 0;border-top:1px solid var(--line)}
.qitem:first-child{border-top:0}
.qitem .qn{font-size:12px;color:var(--muted);font-weight:700}
.qitem .kz{font-size:60px}
.opt{display:flex;gap:8px;align-items:center;padding:6px 0}
.opt label{display:flex;gap:8px;align-items:center;cursor:pointer}
.mt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
@media(max-width:560px){.mt{grid-template-columns:1fr}}
.mt .l{display:flex;align-items:center;gap:10px;padding:5px 0}
.mt .l span{font-family:var(--f-kanji);font-size:26px;min-width:40px}
.score{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

let WC=null;
function words(){
  if(WC)return WC;const out=[];
  [[RAW1,1],[RAW,2]].forEach(pr=>pr[0].forEach(r=>{if(S.hidden[r[0]])return;const e=S.edits[r[0]]||{};out.push({id:r[0],k:e.k!=null?e.k:r[1],m:e.m!=null?e.m:r[2],r:e.r!=null?e.r:r[3],sec:r[4],bk:pr[1],base:1});}));
  S.custom.forEach(c=>out.push({id:c.id,k:c.k,m:c.m,r:c.r||'-',sec:-1,bk:0,base:0}));
  WC=out;return out;
}

const hasR=w=>w.r&&w.r!=='-';

const box=w=>(prog(w)||{}).b||0;
function pool(){
  let w=words();const sc=S.scope;
  if(sc.ids&&sc.ids.length){const set=new Set(sc.ids.map(String));w=w.filter(x=>set.has(String(x.id)));}
  else{
    if(sc.bk.length)w=w.filter(x=>sc.bk.includes(x.bk));
    if(sc.secs.length)w=w.filter(x=>sc.secs.includes(x.bk+':'+x.sec));
    if(sc.aps.length)w=w.filter(x=>sc.aps.includes(apOf(x)||'none'));
    if(sc.setId){const st=S.sets.find(s=>s.id===sc.setId);if(st){const set=new Set(st.ids.map(String));w=w.filter(x=>set.has(String(x.id)));}}
  }
  if(sc.star)w=w.filter(x=>S.stars[x.id]);
  if(sc.wrong)w=w.filter(x=>(prog(x)||{}).x);
  if(sc.unm)w=w.filter(x=>box(x)<4);
  return w;
}

const dayKey=(d)=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

  const now=Date.now();const p=S.prog[w.id]||(S.prog[w.id]={b:0,c:0,w:0,due:0,t:0,x:0});
  if(ok){p.c++;if(now-p.t>3e5)p.b=Math.min(5,p.b+1);p.x=0;}else{p.w++;p.b=Math.max(0,p.b-2);p.x=1;}
  p.due=now+INT[p.b]*864e5;p.t=now;logAnswer(w,ok);save();
}

    seg=seg.trim();if(!seg)return;set.add(normK(seg));
    const t=seg.split(/\s+/);if(t.length>=2)set.add(normK(t.slice(0,-1).join(' ')));
  });
  String(m).replace(/\([^)]*\)/g,' ').replace(/[①②③]/g,'|').replace(/·/g,'|').split('|').forEach(seg=>{seg=seg.trim();if(seg){set.add(normK(seg));const t=seg.split(/\s+/);if(t.length>=2)set.add(normK(t.slice(0,-1).join(' ')));}});
  set.delete('');return set;
}
function checkAnswer(w,ak,val){
  val=String(val||'').trim();if(!val)return false;
  if(ak==='k')return val===w.k;
  if(ak==='r'){const n=normR(val);return w.r.split('・').some(x=>normR(x)===n);}
  return meaningAnswers(w.m).has(normK(val));
}

function shortM(w){let m=w.m.replace(/[①②③]/g,'').replace(/\(.*$/,'').trim();m=m.split('·')[0].trim();return m||w.m;}

function cardFaces(w,d){
  let fk,bk,special=false;if(d==='k>mr'){fk='k';bk='m';special=true;}else{[fk,bk]=d.split('>');}
  if(!hasR(w)&&(fk==='r'||bk==='r')){fk=fk==='r'?'m':fk;bk=bk==='r'?'m':bk;if(fk===bk)bk='k';}

  if(special)others.splice(0,others.length,'r');
  if(!S.cfg.showR)others.splice(0,others.length,...others.filter(x=>x!=='r'));
  back+=others.map(x=>subSide(w,x)).join('');
  return{front,back};
}

function learnRound(){
  const rem=G.d.filter(w=>(G.lv[w.id]||0)<G.max);if(!rem.length)return learnDone();
  let r=S.cfg.shuffle?shuffle(rem):rem.slice();r.sort((a,b)=>(G.lv[b.id]||0)-(G.lv[a.id]||0));
  G.round=shuffle(r.slice(0,7));G.ri=0;G.res=[];learnQ();

function mcOptions(w,ak){
  const correct=ansText(w,ak);const all=words().filter(x=>x.id!==w.id&&(ak!=='r'||hasR(x)));
  const same=shuffle(all.filter(x=>x.bk===w.bk&&x.sec===w.sec)),rest=shuffle(all.filter(x=>!(x.bk===w.bk&&x.sec===w.sec)));
  const seen=new Set([correct]),out=[];
  [...same.slice(0,2),...rest,...same.slice(2)].forEach(x=>{if(out.length>=3)return;const t=ansText(x,ak);if(!seen.has(t)){seen.add(t);out.push(t);}});
  return shuffle([correct,...out]);
}

  const d=qdir(w,type==='wr'),pk=d[0],ak=d[2];

  '<div id="fb"></div></div>';

function learnGrade(ok,given){

function buildTest(n,types,dirSel){
  const old=S.cfg.dir;S.cfg.dir=dirSel;
  let ws=shuffle(pool()).slice(0,n);const items=[];let mtBuf=[];
  ws.forEach((w,i)=>{
    const t=types[i%types.length];
    if(t==='mt'){mtBuf.push(w);return;}
    if(t==='mc'){const d=qdir(w);items.push({t:'mc',w,d,opts:mcOptions(w,d[2])});}
    else if(t==='tf'){const d=qdir(w);const truth=Math.random()<.5;let shown=ansText(w,d[2]);
      if(!truth){const o=mcOptions(w,d[2]).filter(x=>x!==shown);shown=o.length?pick(o):shown;if(shown===ansText(w,d[2]))items.push({t:'tf',w,d,shown,truth:true});else items.push({t:'tf',w,d,shown,truth:false});return;}
      items.push({t:'tf',w,d,shown,truth});}
    else{const d=qdir(w,true);items.push({t:'wr',w,d});}
  });
  for(let i=0;i<mtBuf.length;i+=6){let chunk=mtBuf.slice(i,i+6);
    if(chunk.length<2){chunk.forEach(w=>{const d=qdir(w);items.push({t:'mc',w,d,opts:mcOptions(w,d[2])});});continue;}
    const kind=(S.cfg.dir==='k>r'||S.cfg.dir==='r>k')?'r':'m';chunk=chunk.filter(w=>kind!=='r'||hasR(w));
    if(chunk.length<2)continue;
    items.push({t:'mt',ws:chunk,kind,defs:shuffle(chunk.map(w=>kind==='r'?w.r:shortM(w)))});}
  S.cfg.dir=old;return items;
}

function wFiltered(){
  let w=words().slice();const q=WV.q.trim().toLowerCase();
  if(q)w=w.filter(x=>(x.k+' '+x.m+' '+x.r).toLowerCase().includes(q)||kataOf(x.r).includes(kataOf(q)));
  if(WV.sec!=='all')w=w.filter(x=>(x.bk+':'+x.sec)===WV.sec);
  if(WV.bk!=='all')w=w.filter(x=>String(x.bk)===WV.bk);
  if(WV.ap!=='all')w=w.filter(x=>(apOf(x)||'none')===WV.ap);
  if(WV.star)w=w.filter(x=>S.stars[x.id]);
  if(WV.set){const st=S.sets.find(s=>s.id===WV.set);if(st){const sset=new Set(st.ids.map(String));w=w.filter(x=>sset.has(String(x.id)));}}
  if(WV.status==='new')w=w.filter(x=>!prog(x));
  if(WV.status==='wrong')w=w.filter(x=>(prog(x)||{}).x);
  if(WV.status==='learning')w=w.filter(x=>prog(x)&&box(x)<4&&!(prog(x)||{}).x);
  if(WV.status==='mastered')w=w.filter(x=>box(x)>=4);
  if(WV.sort==='star')w.sort((a,b)=>(S.stars[b.id]?1:0)-(S.stars[a.id]?1:0));
  if(WV.sort==='rand')w=shuffle(w);
  if(WV.sort==='weak')w.sort((a,b)=>box(a)-box(b));
  return w;
}

function parseImport(txt){

      if(p.length>=3&&i<0){m=p[1].trim();r=p[2].trim()||'-';}else if(i>=0){m=rest.slice(0,i).trim();r=rest.slice(i+3).trim()||'-';}else m=rest.trim();}
    else{const p=line.split(',');k=p[0].trim();if(p.length>=3){m=p[1].trim();r=p.slice(2).join(',').trim()||'-';}else m=p.slice(1).join(',').trim();}

  start(el){RESUME=null;G=null;const v=el.dataset.v;if(!pool().length&&v!=='review'){toast('선택한 범위에 단어가 없어요');return;}if(view===v)show();else go(v);},
  star(el){const id=el.dataset.v;toggleStar(id);const on=!!S.stars[id];$$('.starb[data-v="'+id+'"]').forEach(b=>{b.textContent=on?'★':'☆';b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});},
  flt(el){const k=el.dataset.v;S.scope[k]=!S.scope[k];save();VIEWS.home();},
  clearids(){S.scope.ids=[];save();VIEWS.home();},
  resetscope(){S.scope=newScope();save();VIEWS.home();},
  sec(el){S.scope.ids=[];toggleIn(S.scope.secs,el.dataset.v);save();VIEWS.home();$('details')&&($('details').open=true);},
  bk(el){S.scope.ids=[];toggleIn(S.scope.bk,+el.dataset.v);save();VIEWS.home();},
  ap(el){S.scope.ids=[];toggleIn(S.scope.aps,el.dataset.v);save();VIEWS.home();},
  goaps(){WV.panel='apx';go('words');if(view==='words')VIEWS.words();},
  resume(){if(RESUME)go(RESUME.v);},
  discard(){RESUME=null;drawNav();VIEWS.home();},
  aprename(el){const a=S.apx.find(x=>x.id===el.dataset.v),v=($('#apn-'+el.dataset.v).value||'').trim();if(a&&v){a.name=v;save();VIEWS.words();toast('이름을 바꿨어요');}},
  apstudy(el){S.scope=newScope({aps:[el.dataset.v]});save();go('home');},
  apdel(el){if(!armed(el,'한 번 더 눌러 삭제'))return;const id=el.dataset.v;S.apx=S.apx.filter(a=>a.id!==id);Object.keys(S.wap).forEach(k=>{if(S.wap[k]===id)delete S.wap[k];});S.scope.aps=S.scope.aps.filter(x=>x!==id);if(WV.ap===id)WV.ap='all';save();VIEWS.words();toast('부록을 삭제했어요 (단어는 그대로예요)');},
  secstudy(el){S.scope=newScope({secs:[el.dataset.v]});save();go('home');},
  /* flashcards */
  flip(){flipCard();},
  cnext(){cardNext();},
  cprev(){if(G.i>0){G.i--;G.flip=false;drawCards();}},
  cmark(el){const w=G.deck[G.i];const ok=el.dataset.v==='1';G.know[w.id]=ok?1:0;rec(w,ok);cardNext();},
  speak(){const w=G.deck?G.deck[G.i]:(G.queue&&G.queue[0]);if(w)speak(w);},
  creshuffle(){G.deck=shuffle(G.deck);G.dirs=G.deck.map(()=>pickDir());G.i=0;G.flip=false;G.know={};drawCards();},
  crestart(){const d=G.deck.slice();VIEWS.cards();},
  credo(){const un=G.deck.filter(w=>G.know[w.id]===0);G={deck:S.cfg.shuffle?shuffle(un):un,i:0,flip:false,know:{},dirs:un.map(()=>pickDir()),auto:false};drawCards();},
  /* learn */
  pick(el){const q=G.q;if(!q||q.done)return;const i=+el.dataset.v,ok=q.opts[i]===ansText(q.w,q.ak);const bs=$$('.choice');bs[i].classList.add(ok?'good':'bad');bs.forEach((b,x)=>{if(q.opts[x]===ansText(q.w,q.ak))b.classList.add('good');b.disabled=true;});learnGrade(ok,null);},
  idk(){if(G.q&&!G.q.done){if(G.q.type==='mc'){const bs=$$('.choice');bs.forEach((b,x)=>{if(G.q.opts[x]===ansText(G.q.w,G.q.ak))b.classList.add('good');b.disabled=true;});}learnGrade(false,null);}},
  lnext(){G.ri++;learnQ();},
  override(){const q=G.q;G.lv[q.w.id]=(G.lv[q.w.id]||0)+1;G.w--;G.c++;G.res[G.res.length-1].ok=true;rec(q.w,true);G.ri++;learnQ();},
  lround(){learnRound();},
  /* test */
  tstart(){
    const n=Math.max(1,Math.min(pool().length,+$('#t-n').value||1));const types=['mc','tf','wr','mt'].filter(t=>$('#t-'+t).checked);if(!types.length){toast('문제 유형을 하나 이상 선택해 주세요');return;}
    const items=buildTest(n,types,$('#t-dir').value);if(!items.length){toast('문제를 만들 수 없어요');return;}drawTest(items);window.scrollTo(0,0);
  },
  tretry(){const ws=G.wrongW.slice();const old=S.scope;const ids=ws.map(w=>w.id);const keep=Object.assign({},S.scope);S.scope.ids=ids;const items=buildTest(ws.length,['mc','wr'],S.cfg.dir==='k>mr'?'k>m':S.cfg.dir);S.scope=keep;drawTest(items);window.scrollTo(0,0);},
  tstarwrong(){G.wrongW.forEach(w=>{S.stars[w.id]=1;});save();toast(G.wrongW.length+'개 별표 표시했어요');},
  tile(el){tileClick(+el.dataset.v);},
  sstart(){speedStart();},
  sp(){},
  /* review */
  rstart(el){reviewStart(el.dataset.v);},
  rflip(){if(G.flip){return;}G.flip=true;drawReview();},
  rgrade(el){reviewGrade(el.dataset.v);},
  /* words */
  wpanel(el){WV.panel=el.dataset.v;WV.edit=null;VIEWS.words();},
  wedit(el){WV.panel='edit';WV.edit=el.dataset.v;VIEWS.words();window.scrollTo(0,0);},
  wmore(){WV.page++;VIEWS.words();},
  sel(el){const id=el.dataset.v;if(el.checked)WV.sel[id]=1;else delete WV.sel[id];VIEWS.words();},
  selall(el){const l=wFiltered();WV.sel={};if(el.checked)l.forEach(w=>WV.sel[w.id]=1);VIEWS.words();},
  bstar(el){Object.keys(WV.sel).forEach(id=>{if(el.dataset.v==='1')S.stars[id]=1;else delete S.stars[id];});save();VIEWS.words();},
  bstudy(){S.scope=newScope({ids:Object.keys(WV.sel).map(id=>{const w=byId(id);return w?w.id:id;})});save();go('home');},
  bdel(el){if(!armed(el,'한 번 더 눌러 삭제'))return;Object.keys(WV.sel).forEach(id=>delWord(id));WV.sel={};dirty();VIEWS.words();toast('삭제했어요');},
  wdel(el){if(!armed(el,'한 번 더 눌러 삭제'))return;delWord(el.dataset.v);WV.panel='';WV.edit=null;dirty();VIEWS.words();toast('삭제했어요');},
  wreset(el){delete S.edits[el.dataset.v];dirty();WV.panel='';VIEWS.words();},
  wimport(){const list=parseImport($('#imp').value);if(!list.length){toast('가져올 단어를 찾지 못했어요');return;}const ap=resolveAp('imp-ap');WV.defAp=ap;const have=new Set(words().map(w=>w.k+'|'+w.m));let n=0;list.forEach(o=>{if(!have.has(o.k+'|'+o.m)){o.ap=ap;addCustom(o);n++;}});dirty();WV.panel='';VIEWS.words();toast(n+'개 추가했어요');},
  wcopy(){const t=$('#exp');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('복사했어요'),()=>toast('선택된 텍스트를 직접 복사해 주세요'));}catch(e){toast('선택된 텍스트를 직접 복사해 주세요');}},
  setstudy(el){S.scope=newScope({setId:el.dataset.v});save();go('home');},
  setclear(el){const s=S.sets.find(x=>x.id===el.dataset.v);if(s){s.ids=[];save();VIEWS.words();}},
  setdel(el){if(!armed(el,'한 번 더 눌러 삭제'))return;S.sets=S.sets.filter(x=>x.id!==el.dataset.v);if(S.scope.setId===el.dataset.v)S.scope.setId='';save();VIEWS.words();},
  /* prefs */
  bkmake(){$('#bk').value=JSON.stringify(S);},
  bkcopy(){const t=$('#bk');if(!t.value)t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('복사했어요'),()=>toast('선택된 텍스트를 직접 복사해 주세요'));}catch(e){toast('선택된 텍스트를 직접 복사해 주세요');}},
  bkrestore(){try{const o=JSON.parse($('#bk').value);if(!o||o.v!==1)throw 0;S=Object.assign(defaults(),o);S.cfg=Object.assign(defaults().cfg,o.cfg||{});S.scope=Object.assign(defaults().scope,o.scope||{});S.scope.secs=S.scope.secs.map(x=>typeof x==='number'?'2:'+x:x);WC=null;save();applyTheme();toast('복원했어요');VIEWS.prefs();}catch(e){toast('백업 텍스트가 올바르지 않아요');}},
  resetprog(el){if(!armed(el,'한 번 더 눌러 모두 지우기'))return;S.prog={};S.hist={};S.best={};save();toast('학습 기록을 지웠어요');},
  restorebase(){S.hidden={};S.edits={};dirty();toast('기본 단어를 되돌렸어요');}
};
function delWord(id){
  const w=byId(id);if(!w)return;
  if(w.base){S.hidden[w.id]=1;}else{S.custom=S.custom.filter(c=>String(c.id)!==String(id));}
  delete S.stars[id];delete S.prog[id];delete S.wap[id];S.sets.forEach(s=>{s.ids=s.ids.filter(x=>String(x)!==String(id));});
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||!app.parentNode.contains(el))return;
  if(el.tagName==='INPUT'&&el.type==='checkbox'){ACT[el.dataset.act]&&ACT[el.dataset.act](el);return;}
  const f=ACT[el.dataset.act];if(f){f(el);}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.opt){
    const k=el.dataset.opt,v=el.type==='checkbox'?el.checked:el.value;
    if(k==='star')S.scope.star=v;else if(k==='dir')S.cfg.dir=v;else if(k==='shuffle')S.cfg.shuffle=v;
    else if(k==='setId'){S.scope.setId=v;S.scope.ids=[];}
    else if(k==='autoSec'){const n=+v;if(n){S.cfg.autoSec=n;}save();if(view==='cards'&&G){G.auto=!!n;drawCards();}return;}
    else if(k==='pairs')S.cfg.pairs=+v;else S.cfg[k]=v;
    save();if(view==='home')VIEWS.home();else if(['cards','learn','test','match','speed','review'].includes(view))restartView();
  }else if(el.dataset.cfg){
    const k=el.dataset.cfg;S.cfg[k]=el.type==='checkbox'?el.checked:(k==='goal'?Math.max(1,+el.value||20):el.value);save();if(k==='theme')applyTheme();
  }else if(el.dataset.wv){
    const k=el.dataset.wv;WV[k]=el.type==='checkbox'?el.checked:el.value;WV.page=1;VIEWS.words();
  }else if(el.id==='bapsel'&&el.value){
    const v=el.value,ids=Object.keys(WV.sel);let ap='';
    if(v==='__new')ap=newAp('');else if(v!=='__none')ap=v;
    ids.forEach(id=>{const w=byId(id);setAp(w?w.id:id,ap);});save();
    toast(ids.length+'개 '+(ap?'"'+apName(ap)+'"에 지정했어요':'부록을 해제했어요'));WV.sel={};VIEWS.words();
  }else if(el.id==='f-ap'||el.id==='imp-ap'){const n=$('#'+el.id+'-new');if(n)n.hidden=el.value!=='__new';
  }else if(el.id==='bset'&&el.value){
    const st=S.sets.find(s=>s.id===el.value);if(st){Object.keys(WV.sel).forEach(id=>{const w=byId(id);const real=w?w.id:id;if(!st.ids.some(x=>String(x)===String(real)))st.ids.push(real);});save();toast(Object.keys(WV.sel).length+'개를 "'+st.name+'"에 추가했어요');WV.sel={};VIEWS.words();}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='wq'){WV.q=e.target.value;WV.page=1;const pos=e.target.selectionStart;VIEWS.words();const i=$('#wq');if(i){i.focus();try{i.setSelectionRange(pos,pos);}catch(x){}}}
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='wf'){const q=G.q;if(!q||q.done)return;const v=$('#wans').value.trim();if(!v)return;learnGrade(checkAnswer(q.w,q.ak,v),v);}
  else if(f.id==='tf'){gradeTest(f);window.scrollTo(0,0);}
  else if(f.id==='wform'){
    const k=$('#f-k').value.trim(),m=$('#f-m').value.trim(),r=$('#f-r').value.trim()||'-';if(!k||!m)return;
    const ap=resolveAp('f-ap');WV.defAp=ap;
    if(WV.panel==='edit'&&WV.edit!=null){const w=byId(WV.edit);if(w){if(w.base)S.edits[w.id]={k,m,r};else{const c=S.custom.find(x=>String(x.id)===String(w.id));if(c){c.k=k;c.m=m;c.r=r;}}setAp(w.id,ap);}}
    else addCustom({k,m,r,ap});
    dirty();WV.panel='';WV.edit=null;VIEWS.words();toast('저장했어요');
  }
  else if(f.id==='apform'){const n=($('#apname').value||'').trim();newAp(n);save();VIEWS.words();}
  else if(f.id==='setform'){const name=$('#setname').value.trim();if(!name)return;S.sets.push({id:'s'+(S.nextS++),name,ids:[]});save();VIEWS.words();}
});
/* swipe on cards */
let sx=null;
document.addEventListener('pointerdown',e=>{if(view==='cards'&&e.target.closest('#cw'))sx=e.clientX;else sx=null;});
document.addEventListener('pointerup',e=>{if(sx==null||view!=='cards'||!G||!G.deck)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>70){if(dx<0)cardNext();else if(G.i>0){G.i--;G.flip=false;drawCards();}}});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();const typing=tag==='input'&&e.target.type!=='checkbox'&&e.target.type!=='radio'||tag==='textarea'||tag==='select';
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(view==='cards'&&G&&G.deck&&!typing){
    if(G.i>=G.deck.length)return;
    if(e.key===' '||e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();flipCard();}
    else if(e.key==='ArrowRight'){cardNext();}
    else if(e.key==='ArrowLeft'){if(G.i>0){G.i--;G.flip=false;drawCards();}}
    else if(e.key==='s'||e.key==='S'){ACT.star({dataset:{v:G.deck[G.i].id}});}
    else if(e.key==='1'||e.key==='2'){ACT.cmark({dataset:{v:e.key==='2'?'1':'0'}});}
  }
  else if(view==='learn'&&G&&G.q&&!typing){
    if(G.q.type==='mc'&&!G.q.done&&/^[1-4]$/.test(e.key)){const i=+e.key-1;if(G.q.opts[i]!==undefined)ACT.pick({dataset:{v:i}});}
    else if(e.key==='Enter'){const b=$('#lnb');if(b&&G.q.done)b.click();}
  }
  else if(view==='learn'&&G&&!G.q&&e.key==='Enter'){const b=$('#lnb');if(b)b.click();}
  else if(view==='learn'&&e.key==='Enter'&&tag==='button'&&e.target.id==='lnb'){}
  else if(view==='speed'&&G&&G.q&&/^[1-4]$/.test(e.key)){speedPick(+e.key-1);}
  else if(view==='review'&&G&&G.queue&&G.queue.length&&!typing){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!G.flip){G.flip=true;drawReview();}}
    else if(G.flip&&['1','2','3','4'].includes(e.key)){reviewGrade(['again','hard','good','easy'][+e.key-1]);}
  }
});
/* speed answers share the choice buttons */
document.addEventListener('click',e=>{const el=e.target.closest('#sq .choice');if(el&&view==='speed')speedPick(+el.dataset.v);},true);
const _pick=ACT.pick;ACT.pick=function(el){if(view==='speed')return;_pick(el);};

window.addEventListener('hashchange',route);
applyTheme();
route();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
